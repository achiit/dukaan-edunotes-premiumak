const compressImage=(file,callback)=>{
const reader=new FileReader();
reader.onloadend=()=>{
const img=new Image();
img.onload=()=>{
const canvas=document.createElement('canvas');const MAX=800;
let w=img.width,h=img.height;
if(w>h){if(w>MAX){h=h*(MAX/w);w=MAX;}}else{if(h>MAX){w=w*(MAX/h);h=MAX;}}
canvas.width=w;canvas.height=h;canvas.getContext('2d').drawImage(img,0,0,w,h);
callback(canvas.toDataURL('image/jpeg',0.6));
};img.src=reader.result;};
reader.readAsDataURL(file);};

useEffect(()=>{
  if(!window.FB_DB) return;

  const handle=(name,setter)=>{
    return db.collection(name).onSnapshot(snap=>{
      const data=snap.docs.map(d=>({...d.data(),id:d.id}));
      data.sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
      setter(data); setCache(name,data);
    },err=>console.warn(name+' err:',err.message));
  };

  const u1=handle('notes',setNotes);
  const u2=handle('quizzes',setQuizzes);
  const u3=handle('announcements',setAnnouncements);
  const u4=handle('railtest',setRailtest);
  const u5=handle('payments',setPayments);
  const u6=handle('students',setStudentsList);

  const u7=db.collection('config').doc('settings').onSnapshot(doc=>{
    if(doc.exists){const s={...DEFAULT_SETTINGS,...doc.data()};setSettings(s);setCache('settings',s);}
  },err=>console.warn('settings err:',err.message));

  return ()=>{u1();u2();u3();u4();u5();u6();u7();};
},[]);

</div>
</div>))}
</div>
</section>)}

{adminTab==='payments'&&(
<section className="glass rounded-2xl p-6">
<h3 className="text-xl font-black mb-5 text-yellow-400">📸 Payments ({payments.length})</h3>
<div className="overflow-x-auto">
<table className="w-full text-left text-sm">
<thead><tr className="border-b border-yellow-500/30">
<th className="p-2 text-yellow-400 text-xs">Student</th><th className="p-2 text-yellow-400 text-xs">Mobile</th><th className="p-2 text-yellow-400 text-xs">UTR</th><th className="p-2 text-yellow-400 text-xs">Proof</th><th className="p-2 text-yellow-400 text-xs">Status</th><th className="p-2 text-yellow-400 text-xs">Action</th>
</tr></thead>
<tbody>
{payments.map(p=>(
<tr key={p.id} className="border-b border-white/5">
<td className="p-2 font-bold text-white">{p.studentName}</td>
<td className="p-2 font-mono text-cyan-400">{p.username}</td>
<td className="p-2 font-mono font-bold text-yellow-400">{p.utr}</td>
<td className="p-2"><img src={p.screenshot} onClick={()=>setZoomImage(p.screenshot)} className="h-14 w-14 object-cover rounded-lg border-2 border-yellow-400/50 cursor-pointer" alt="proof"/></td>
<td className="p-2"><span className={`px-2 py-0.5 rounded-full text-xs font-black uppercase ${p.status==='approved'?'bg-emerald-500/20 text-emerald-400':p.status==='rejected'?'bg-rose-500/20 text-rose-400':'bg-amber-500/20 text-amber-400'}`}>{p.status}</span></td>
<td className="p-2"><div className="flex gap-2 flex-wrap">
{p.status==='pending'&&(<>
<button onClick={()=>verifyPayment(p.id,'approved')} className="px-3 py-1 bg-emerald-600 text-white rounded-lg text-xs font-black">✅</button>
<button onClick={()=>verifyPayment(p.id,'rejected')} className="px-3 py-1 bg-rose-600 text-white rounded-lg text-xs font-black">❌</button>
</>)}
<button onClick={()=>deletePayment(p.id)} className="px-3 py-1 bg-red-700 text-white rounded-lg text-xs font-black">🗑️</button>
</div></td>
</tr>))}
{payments.length===0&&(<tr><td colSpan="6" className="p-6 text-center text-white/50">Koi payment nahi.</td></tr>)}
</tbody>
</table>
</div>
</section>)}
</div>)}

<div className="max-w-4xl mx-auto w-full"><AdSlot code={settings.adBottomCode} slot="Bottom Banner"/></div>

</main>

{openNote&&(
<div className="fixed inset-0 bg-black/85 z-50 flex items-center justify-center p-2 sm:p-4 backdrop-blur-md">
<div className="w-full max-w-3xl max-h-[92vh] overflow-hidden rounded-3xl shadow-2xl flex flex-col" style={{background:'linear-gradient(135deg,rgba(20,10,40,0.98),rgba(10,5,25,0.98))',border:'2px solid rgba(255,215,0,0.3)'}}>
<div className="bg-gradient-to-r from-yellow-500 via-pink-500 to-purple-600 text-white p-4 flex justify-between items-center"><div><h3 className="font-black text-base">{openNote.title}</h3><p className="text-xs opacity-90">Class {openNote.classLevel} • {openNote.subject}</p></div><button onClick={()=>setOpenNote(null)} className="p-2 rounded-lg bg-black/30 text-lg">✕</button></div>
<div className="p-5 overflow-y-auto page-body flex-1 text-sm"><h3 className="text-lg font-black mb-3 text-yellow-400">{openNote.pages[openPage].heading}</h3><div dangerouslySetInnerHTML={{__html:openNote.pages[openPage].body}}/></div>
<div className="p-4 border-t border-yellow-500/20 space-y-2">
<button onClick={()=>toggleRead(openNote.id)} className={`w-full py-2.5 rounded-xl font-black text-sm ${readNotes.includes(openNote.id)?'bg-emerald-500 text-white':'bg-white/10 text-white/70 border-2 border-white/20'}`}>{readNotes.includes(openNote.id)?'✅ Marked as Read':'⬜ Mark as Read'}</button>
<div className="flex justify-between items-center gap-2">
<button onClick={()=>setOpenPage(Math.max(0,openPage-1))} disabled={openPage===0} className="px-4 py-2 rounded-xl bg-white/10 border border-white/20 text-white font-bold text-sm disabled:opacity-30">← Prev</button>
<span className="text-sm font-bold text-yellow-400">Page {openPage+1} / {openNote.pages.length}</span>
<button onClick={()=>setOpenPage(Math.min(openNote.pages.length-1,openPage+1))} disabled={openPage===openNote.pages.length-1} className="btn-gold px-4 py-2 rounded-xl text-sm disabled:opacity-30">Next →</button>
</div>
</div>
</div>
</div>)}

{activeQuiz&&(
<div className="fixed inset-0 bg-black/85 z-50 flex items-center justify-center p-2 sm:p-4 backdrop-blur-md">
<div className="w-full max-w-2xl max-h-[92vh] overflow-y-auto rounded-3xl shadow-2xl" style={{background:'linear-gradient(135deg,rgba(20,10,40,0.98),rgba(10,5,25,0.98))',border:'2px solid rgba(16,185,129,0.4)'}}>
<div className="sticky top-0 bg-gradient-to-r from-emerald-500 via-teal-500 to-cyan-500 text-white p-4 flex justify-between items-center rounded-t-3xl z-10"><div><h3 className="font-black text-base">{activeQuiz.title}</h3><p className="text-xs opacity-90">{activeQuiz.questions.length} Questions</p></div><button onClick={closeQuiz} className="p-2 rounded-lg bg-black/30 text-lg">✕</button></div>
<div className="p-5 space-y-4">
{activeQuiz.questions.map((q,i)=>{
const chosen=quizAnswers[i];const correct=q.correct;
return(
<div key={i} className={`p-4 rounded-2xl border-2 ${quizSubmitted?(chosen===correct?'border-emerald-500 bg-emerald-500/10':'border-rose-500 bg-rose-500/10'):'border-white/15 bg-white/5'}`}>
<p className="font-bold mb-3 text-white">Q{i+1}. {q.q}</p>
<div className="space-y-2">
{q.options.map((opt,idx)=>(
<label key={idx} className={`flex items-center gap-2 p-2.5 rounded-xl cursor-pointer text-sm ${quizSubmitted&&idx===correct?'bg-emerald-500/20 font-bold border border-emerald-500':'hover:bg-white/10 text-white/80 border border-transparent'}`}>
<input type="radio" name={`q${i}`} disabled={quizSubmitted} checked={chosen===idx} onChange={()=>setQuizAnswers({...quizAnswers,[i]:idx})} className="accent-yellow-400"/>
<span>{String.fromCharCode(65+idx)}. {opt}</span>
{quizSubmitted&&idx===correct&&<span className="ml-auto text-emerald-400 font-black">✓</span>}
{quizSubmitted&&chosen===idx&&idx!==correct&&<span className="ml-auto text-rose-400 font-black">✗</span>}
</label>))}
</div>
</div>);})}
</div>
<div className="p-5 border-t border-emerald-500/20">
{!quizSubmitted?(
<button onClick={submitQuiz} disabled={Object.keys(quizAnswers).length<activeQuiz.questions.length} className={`w-full py-3 rounded-xl font-black text-white ${Object.keys(quizAnswers).length<activeQuiz.questions.length?'bg-white/10 text-white/40 cursor-not-allowed':'btn-emerald'}`}>✅ Submit</button>
):(
<div className="text-center">
<p className="text-3xl font-black mb-3 text-white">🎉 Score: <span className="text-yellow-400">{quizScore}</span> / {activeQuiz.questions.length}</p>
<button onClick={closeQuiz} className="btn-purple w-full py-3 rounded-xl">Close</button>
</div>)}
</div>
</div>
</div>)}

{zoomImage&&(
<div onClick={()=>setZoomImage(null)} className="fixed inset-0 bg-black/90 flex items-center justify-center z-[60] p-4 cursor-zoom-out">
<img src={zoomImage} className="max-h-[85vh] rounded-2xl border-4 border-yellow-400" alt="zoom"/>
</div>)}

<a href={`https://wa.me/${settings.whatsappNumber}?text=${encodeURIComponent('Hello, mujhe EduNotes Premium ke baare mein help chahiye.')}`} target="_blank" rel="noopener noreferrer" className="fixed bottom-6 right-6 z-40 flex items-center gap-2 text-white font-black px-5 py-3.5 rounded-full shadow-2xl hover:scale-110 transition-transform" style={{background:'linear-gradient(135deg,#25d366,#128c7e)'}}>
<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>
<span className="hidden sm:inline text-sm">Support</span>
</a>

<footer className="text-center py-10 px-4">
<div className="max-w-2xl mx-auto rounded-2xl py-6 px-6 border-2 border-yellow-500/40 relative overflow-hidden" style={{background:'linear-gradient(135deg,rgba(20,10,40,0.9),rgba(10,5,25,0.9))'}}>
<div className="relative"><p className="mb-3 text-sm text-white/60">© {new Date().getFullYear()} EduNotes Premium</p><div className="h-px bg-gradient-to-r from-transparent via-yellow-500 to-transparent my-3"/><p className="font-black text-sm tracking-[0.15em] rainbow-text">DEVELOPED BY : ABHISHEK KUMAR YADAV</p></div>
</div>
</footer>
</div>);
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);

// ⚡ INSTANT SPINNER HIDE — jaise hi React render ho, spinner gayab
(function(){
  var l=document.getElementById('loading-screen'), r=document.getElementById('root');
  if(!l||!r) return;
  var hideNow = function(){ if(r.innerHTML.trim()){ l.style.display='none'; try{obs.disconnect();}catch(e){} } };
  var obs = new MutationObserver(hideNow);
  obs.observe(r, {childList:true, subtree:true});
  hideNow();
  // Safety fallback: 8 sec baad force hide
  setTimeout(function(){ l.style.display='none'; try{obs.disconnect();}catch(e){} }, 8000);
})();
</script>
</body>
</html>
